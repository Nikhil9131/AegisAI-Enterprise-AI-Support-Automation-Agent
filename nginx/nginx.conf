events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    upstream web_backend {
        server web-app:80;
    }

    upstream ai_backend {
        server ai-service:8001;
    }

    server {
        listen 80;
        server_name localhost aegis.enterprise;

        # Direct API calls to Python FastAPI AI microservice
        location /api/v1/ {
            proxy_pass http://ai_backend/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # OpenAPI Docs
        location /docs {
            proxy_pass http://ai_backend/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://ai_backend/openapi.json;
            proxy_set_header Host $host;
        }

        # All web application requests to CodeIgniter 3
        location / {
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
