name: Deploy - Amazon ECS Fargate

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Deploy to AWS ECS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build and push Web App
          docker build -t $ECR_REGISTRY/aegis-web-app:$IMAGE_TAG ./web-app
          docker tag $ECR_REGISTRY/aegis-web-app:$IMAGE_TAG $ECR_REGISTRY/aegis-web-app:latest
          docker push $ECR_REGISTRY/aegis-web-app:$IMAGE_TAG
          docker push $ECR_REGISTRY/aegis-web-app:latest

          # Build and push AI Service
          docker build -t $ECR_REGISTRY/aegis-ai-service:$IMAGE_TAG -f ai-service/Dockerfile .
          docker tag $ECR_REGISTRY/aegis-ai-service:$IMAGE_TAG $ECR_REGISTRY/aegis-ai-service:latest
          docker push $ECR_REGISTRY/aegis-ai-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/aegis-ai-service:latest

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: aws/ecs-task-definition.json
          service: aegis-production-service
          cluster: aegis-production-cluster
          wait-for-service-stability: true
