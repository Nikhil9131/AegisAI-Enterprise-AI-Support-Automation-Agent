name: CI - Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. PHP Application Verification
  php-test:
    name: PHP 8.2 CI & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, curl, mbstring, zip
          coverage: none

      - name: Validate PHP Syntax
        run: |
          find web-app -type f -name "*.php" -exec php -l {} \; > /dev/null
          echo "All PHP files passed syntax validation."

  # 2. Python AI Microservice Tests
  python-test:
    name: FastAPI & Multi-Agent Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install pytest

      - name: Run Database Seeder
        run: |
          python database/init_db.py

      - name: Run Unit & Integration Tests
        run: |
          python -m pytest ai-service/tests/ -v -s
        env:
          DB_CONNECTION: sqlite
          QDRANT_URL: ":memory:"
          LLM_PROVIDER: gemini

  # 3. Docker Build Verification
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [php-test, python-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web App Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-app
          push: false
          tags: aegis-web-app:ci-test

      - name: Build AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ai-service/Dockerfile
          push: false
          tags: aegis-ai-service:ci-test
